<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>第4周安全隧道验收 Demo</title>
<style>body{font:16px system-ui;margin:32px;max-width:960px}button{margin:4px;padding:8px 14px}pre{background:#111;color:#d7ffd7;padding:16px;white-space:pre-wrap;border-radius:6px}.ok{color:green}.bad{color:#b00}</style>
<h1>第4周安全隧道 Demo</h1>
<p>正常请求通过 Axios 拦截器：请求前封装，响应后解密。其他按钮用于复现重放、篡改和过期校验。</p>
<button id="normal">正常请求（Axios）</button><button id="replay">重复请求</button><button id="tamper">篡改密文</button><button id="expired">过期请求</button>
<pre id="log">等待测试…</pre>
<script src="/evidence/week4/secure-tunnel-browser.js"></script>
<script>
const out=document.getElementById('log'); let last=null;
const log=(x)=>{out.textContent += '\n'+x};
async function config(){const r=await fetch('/api/v1/tunnel/config');return (await r.json()).data}
async function raw(mode){
  const c=await config(); const ctx=await week4Tunnel.sealSecureRequest({order_id:'BROWSER-W4-001',amount:99.5},{method:'POST',path:'/api/v1/tunnel/echo',config:c});
  let env=ctx.envelope;
  if(mode==='replay'&&last) env=last;
  if(mode==='tamper') env={...env,ciphertext:(env.ciphertext[0]==='A'?'B':'A')+env.ciphertext.slice(1)};
  if(mode==='expired') env={...env,ts:env.ts-601};
  if(mode!=='replay') last=env;
  const r=await fetch('/api/v1/tunnel/echo',{method:'POST',headers:{'Content-Type':'application/json','X-Secure-Tunnel':'v2'},body:JSON.stringify(env)});
  const body=await r.json(); log(mode+' HTTP '+r.status+'\n'+JSON.stringify(body,null,2));
  if(r.ok) log('解密响应：'+JSON.stringify(ctx.openResponse(body.data,r.status)));
}
async function normalAxios(){
  try{
    let wire;
    const response=await week4Tunnel.client.post('/api/v1/tunnel/echo',{order_id:'BROWSER-W4-001',amount:99.5},{secureTunnel:true,onSecureTunnelWire(value){wire=value;last=value.request;}});
    log('normal（Axios 拦截器） HTTP '+response.status+'\n'+JSON.stringify(response.data,null,2));
    log('解密响应：'+JSON.stringify(response.data.data));
    log('网络请求字段：'+Object.keys(wire.request).join(', '));
  }catch(e){log('normal 客户端失败：'+e.message)}
}
normal.onclick=normalAxios; replay.onclick=()=>raw('replay'); tamper.onclick=()=>raw('tamper'); expired.onclick=()=>raw('expired');
</script></html>
